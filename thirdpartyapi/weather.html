
<!DOCTYPE html>
<html>
<head>
    <title>Weather Application</title>
</head>
<body>
    <h2>Weather Application</h2>

    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <pre id="result"></pre>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            const result = document.getElementById("result");

            const apiKey = "YOUR_API_KEY";

            if (!city) {
                result.textContent = "Please enter a city name";
                return;
            }

            try {
                const url =
                    `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    result.textContent = data.message || "Unable to get weather";
                    return;
                }

                result.textContent =
                    "City: " + data.name +
                    "\nCountry: " + data.sys.country +
                    "\nTemperature: " + data.main.temp + " °C" +
                    "\nFeels Like: " + data.main.feels_like + " °C" +
                    "\nWeather: " + data.weather[0].description +
                    "\nHumidity: " + data.main.humidity + "%" +
                    "\nWind Speed: " + data.wind.speed + " m/s";

            } catch (error) {
                result.textContent = "Error fetching weather data";
            }
        }
    </script>
</body>
</html>
